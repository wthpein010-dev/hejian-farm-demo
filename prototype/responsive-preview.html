<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>禾间 · 手机尺寸预览</title>
  <style>
    :root { --preview-width:390px; font-family:'Segoe UI','Microsoft YaHei',sans-serif; color:#20372d; background:#eaf0eb; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; padding:19px 12px; height:100dvh; display:flex; flex-direction:column; gap:16px; }
    header { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; width:100%; max-width:650px; margin:0 auto; gap:12px; flex-shrink:0; }
    h1 { font-size:16px; margin:0 0 5px; font-weight:550; }
    p { font-size:12px; line-height:1.6; color:#5e705f; margin:0; }
    nav { display:flex; gap:5px; }
    button { font:inherit; font-size:14px; min-width:48px; min-height:48px; padding:9px 11px; border:1px solid #c8d6c6; border-radius:9px; cursor:pointer; background:#f6f8f5; color:#365840; }
    button[aria-pressed="true"] { background:#245c43; color:white; border-color:#245c43; }
    button:hover { filter:brightness(.96); } button:focus-visible { outline:3px solid #447c59; outline-offset:2px; }
    .frame { width:calc(var(--preview-width) + 16px); max-width:100%; min-height:0; flex:1; margin:0 auto; border:8px solid #fbfcf9; border-radius:29px; overflow:hidden; box-shadow:0 0 0 1px #d1dcd1,0 15px 60px #26403118; }
    iframe { display:block; border:0; width:100%; height:100%; min-height:0; background:#f6f8f5; }
    @media(max-width:500px) { body { padding:10px 0 0; gap:12px; } header { padding:0 12px; } h1 { font-size:16px; } button { padding:8px; } .frame { width:var(--preview-width); border:0; border-radius:0; box-shadow:none; } }
    @media(prefers-reduced-motion:reduce) { * { scroll-behavior:auto; } }
  </style>
</head>
<body>
  <header><div><h1>禾间 · 手机体验</h1><p>切换预览宽度；窄窗口按可用宽度显示。</p></div><nav aria-label="预览屏幕宽度"><button type="button" aria-pressed="false" onclick="resizePreview(320,this)">320</button><button type="button" aria-pressed="true" onclick="resizePreview(390,this)">390</button><button type="button" aria-pressed="false" onclick="resizePreview(430,this)">430</button></nav></header>
  <main class="frame"><iframe src="index.html" title="禾间手机端可点击原型"></iframe></main>
  <script>
    function resizePreview(width,button) {
      document.documentElement.style.setProperty('--preview-width',width+'px');
      document.querySelectorAll('nav button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
    }
  </script>
</body>
</html>
