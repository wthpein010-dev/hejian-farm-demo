name: Verify and deploy H5

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Run domain, resilience, API and client tests
        run: node --test
      - name: Check JavaScript syntax
        run: |
          node --check prototype/app.js
          node --check prototype/ui.js
          node --check prototype/domain.js
          node --check prototype/systems.js
          node --check prototype/expansion.js
          node --check prototype/boot.js
          node --check services/api/src/providers.mjs
          node --check services/api/src/client-address.mjs
          node --check services/api/src/operations.mjs
          node --check services/api/src/server.mjs
          node --check services/api/tools/load-api.mjs

  verify-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Install exact dependencies without dependency lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify audited compiler adapters
        run: npm run verify:dependencies
      - name: Audit known dependency vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Check mobile types and token adapter
        run: |
          npm run typecheck
          node tools/sync-mobile-tokens.mjs --check
      - name: Compile four platform targets
        run: |
          npm run build:h5
          npm run build:weixin
          npm run build:douyin
          npm run build:app
      - name: Save unsigned platform resources
        uses: actions/upload-artifact@v4
        with:
          name: mobile-platform-resources-unsigned
          path: apps/mobile/dist/build
          if-no-files-found: error

  deploy:
    needs: [verify, verify-mobile]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload H5 artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototype
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
